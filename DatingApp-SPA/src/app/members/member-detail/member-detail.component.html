<div class="container mt-4">
  <div class="row">
    <h3>{{user.knownAs}}'s Profile</h3>
  </div>
  <div class="row">
    <div class="col-sm-4">
      <div class="card border">
        <img class="card-img-top img-thumbnail" src="{{user.photoUrl || '../../../assets/user.png'}}" alt="{{user.knownAs}}">
        <div class="card-body">
          <div>
            <strong>Location:</strong>
            <p>{{user.city}}, {{user.country}}</p>
          </div>
          <div>
            <strong>Age:</strong>
            <p>{{user.age}}</p>
          </div>
          <div>
              <strong>Last Active:</strong>
              <p>{{user.lastActive | timeAgo}}</p> <!--using time-ago-pipe library-->
            </div>
            <div>
                <strong>Member Since:</strong>
                <p>{{user.created | date: 'mediumDate'}}</p> <!--pipe date is for formatting-->
              </div>
        </div>
        <div class="card-footer">
          <div class="btn-group d-flex">
            <button class="btn btn-primary mr-4 w-100">Like</button>
            <button class="btn btn-success w-100" (click)="selectTabs(3)" >Message</button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-sm-8 border">
      <div class="tab-panel">
        <tabset class="member-tabset" #memberTabs> <!--tabs are array with id's 0,1,2,3,...-->
          <tab heading="About {{user.knownAs}}">
          <h4>Description</h4>
          <p>{{user.introduction}}</p>
          <h4>Looking For</h4>
          <p>{{user.lookingFor}}</p>
        </tab>
        <tab heading = "Interests">
          <h4>Interests</h4>
          <p>{{user.interest}}</p>
        </tab>
        <tab heading = "Photos">
          <ngx-gallery [options]="galleryOptions" [images]="galleryImages"></ngx-gallery>
        </tab>
        <tab heading = "Messages">
            <app-member-messages [recipientId]="user.id"></app-member-messages>
          </tab>
        </tabset>
      </div>
      
    </div>
  </div>
</div>
