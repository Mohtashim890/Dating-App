<div class="container mt-4">
    <div class="row">
      <div class="col-sm-4">
          <h3>Your Profile</h3>
      </div>
      <div class="col-sm-8">
        <div *ngIf="editForm.dirty" class="alert alert-info">
          <strong>Information: </strong>You have made changes. Any unsaved changes will be lost!
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-4">
        <div class="card border">
          <img class="card-img-top img-thumbnail" src="{{photoUrl}}" alt="{{user.knownAs}}">
          <div class="card-body">
            <div>
              <strong>Location:</strong>
              <p>{{user.city}}, {{user.country}}</p>
            </div>
            <div>
              <strong>Age:</strong>
              <p>{{user.age}}</p>
            </div>
            <div>
                <strong>Last Active:</strong>
                <p>{{user.lastActive}}</p>
              </div>
              <div>
                  <strong>Member Since:</strong>
                  <p>{{user.created}}</p>
                </div>
          </div>
          <div class="card-footer">
              <button [disabled]="!editForm.dirty" form="editForm" class="btn btn-success btn-block">Save Changes</button>
          </div>
        </div>
      </div>
      <div class="col-sm-8 border">
        <div class="tab-panel">
          <tabset>
            <tab heading="Edit Profile">
              <form #editForm="ngForm" (ngSubmit)="updateUser()" id="editForm"> <!--reference var will store form states-->
                  <h4>Description</h4>
                  <textarea class="form-control" name="introduction" rows="5"
                   [(ngModel)]="user.introduction"></textarea>
                  <h4>Looking For</h4>
                  <textarea class="form-control" name="lookingFor" rows="5"
                   [(ngModel)]="user.lookingFor"></textarea>
                   <h4>Interests</h4>
                   <textarea class="form-control" name="interest" rows="5"
                    [(ngModel)]="user.interest"></textarea>
                    <h4>Location Details</h4>
                    <div class="form-inline">
                      <label for="city" class="mr-2">City: </label>
                      <input class="form-control mr-4" name="city" type="text" [(ngModel)]="user.city">
                      <label for="country" class="mr-2">Country: </label>
                      <input class="form-control" name="country" type="text" [(ngModel)]="user.country">
                    </div>
              </form>
          </tab>
          <tab heading = "Edit photos">
            <app-photo-editor [photos]="user.photos" (getMemberPhotoChange)="updateMainPhoto($event)"></app-photo-editor>
          </tab>
          </tabset>
        </div>
        
      </div>
    </div>
  </div>
