<nav class="navbar navbar-expand-md navbar-dark bg-primary">
  <div class="container">
      <a class="navbar-brand" [routerLink]="['/home']"> Find New Friends </a>

      <ul *ngIf="loggedIn()" class="navbar-nav mr-auto">
        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" [routerLink]="['/members']"> Matches </a>
        </li>
        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" [routerLink]="['/lists']" > Lists </a>
        </li>
        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" [routerLink]="['/messages']" > Messages </a>
        </li>
      </ul>
  
    <!-- DropDown upon login-->
      <div *ngIf="loggedIn()" class="dropdown" dropdown>
        <span class="mr-2">
          <img src="{{photoUrl}}" alt="">
        </span>
        <a class="dropdown-toggle " dropdownToggle>
          <!-- we can make properties optional using ? (safe navigation operator)-->
          Welcome {{authService.decodedToken?.unique_name | titlecase}}
        </a>
        <div class="dropdown-menu mt-3" *dropdownMenu>
          <a class="dropdown-item" [routerLink]="['/member/edit']"><i class="fa fa-user"></i> Profile</a>
          <div class = "dropdown-divider"></div>
          <a class="dropdown-item" (click)="logout()"><i class="fa fa-sign-out"></i>Log Out</a>
        </div>
      </div>
  
  
    <!--each angular html elements has two interfaces: in .html and in component.ts
        1.make html form an angular (a.reactive b.template) using # (refrence variables)
        2.refrence variables hold the states of elements (reactive nature)
        3.tell application about it by including form module
        4.for two binding include a-ngmodel directive
        5.use ngSubmit for binding button to method in component.ts -->
  
      <form *ngIf="!loggedIn()" #loginForm = "ngForm" class="form-inline my-2 my-lg-0" (ngSubmit) = "login()">
  
        <input class="form-control mr-sm-2" type="text" placeholder="Username" name = "username"
         required [(ngModel)]="model.username">
  
        <input class="form-control mr-sm-2" type="password" placeholder="Password" name = "password" 
        required [(ngModel)]="model.password">
  
        <button [disabled]="!loginForm.valid" class="btn btn-outline-success my-2 my-sm-0" type="submit">Login</button>
        
      </form>
  </div>
</nav>
